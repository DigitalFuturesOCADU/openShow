# Manual corrections, applied on top of the extracted data.
#
# WHY THIS FILE EXISTS
# `npm run extract` deletes and regenerates content/projects/ on every run, so
# editing those files by hand does not survive. Anything entered here does.
# Keep manual data here; treat content/ as build output.
#
# Keyed by WordPress post id, not slug — ids are stable, slugs can be
# regenerated. The id is in each project's frontmatter as `id`.
#
# Any frontmatter field can be overridden. Values here win over the WXR, and
# each project records which fields were overridden in `manualOverrides`, so a
# reader can always tell what came from WordPress and what a human supplied.
#
# Overrides are applied AFTER the audit gate. The gate measures fidelity to the
# source export and must not be silenced by hand-entered corrections — if the
# gate says 8 items have no resolvable year, that stays true of the export no
# matter how many years are filled in here.

