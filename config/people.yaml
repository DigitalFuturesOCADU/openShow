# Creator registry corrections — REVIEW
#
# Generated from 347 distinct credited names across 262 projects.
# Edit and re-run "npm run extract". Regenerated only when absent, so edits survive.
#
# aliases:     map a spelling onto the canonical one. Both still appear in the
#              person's "variants", so nothing is lost.
# sortNames:   override the "Family, Given" sort key where the heuristic is wrong.
# collectives: credits that are groups or studios rather than individuals.
# notPeople:   credits that are not creators at all and should be discarded.

# --- Same person credited two ways. Detected automatically: accents, hyphens
# --- and spacing differ but the letters are identical. Confirm each.
aliases:
  # Canonical spellings confirmed by hand, 2026-08-04. Several of these the
  # automatic checks could not have proposed: an edit-distance check will not
  # cross five characters, and one name being a prefix of another is not a
  # misspelling at all.
  "Mika Maclear-Wall": "Mika Maclear Wall"
  "Mika MacLOear Wall": "Mika Maclear Wall"
  "Mika Wall": "Mika Maclear Wall"
  "Salisa Jatweerapong": "Salisa Jatuweerapong"
  "Josh Igwe": "Joshua Igwe"
  "Aileen Dong": "Ailin Dong"
  "Aileen D": "Ailin Dong"
  "Arshia Sobhan": "Arshia Sobhan Sarbandi"
  "Niloofar Sanandaji Zadeh": "Niloofar Sanandajizadeh"
  # Confirmed by hand. Too short for the edit-distance check to propose, since
  # one name is a prefix of the other rather than a misspelling of it.
  "Niloofar Sanandaji": "Niloofar Sanandajizadeh"
  "Orus Mateo Castano Suarez": "Orus Mateo Castaño-Suárez"

  # Confirmed by hand, 2026-11-17. First-name-only credits: two teams credited
  # themselves that way — "Achal, Jamie, Krishnokoli, Simran" (2020) and
  # "Ladan, Shikhar, Peiheng" (2019 Feb) — and each name matches exactly one
  # person in the same show and cohort.
  "Achal": "Achal Shah"
  "Krishnokoli": "Krishnokoli Roy Chakraborty"
  "Simran": "Simran Duggal"
  "Ladan": "Ladan Siad"
  "Shikhar": "Shikhar Juyal"
