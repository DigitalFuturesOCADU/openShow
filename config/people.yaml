  "g blekkenhorst": "Gillian Blekkenhorst"
  "Patricia Mwenda": "Patricia Kanana Mwenda"
  "Patricia \"Trish\" Kanana Mwenda": "Patricia Kanana Mwenda"
  "Carisa Antariksa": "Carisa Putri Antariksa"
  "Neo Chen": "Neo Nuo Chen"
  "Sara Boo": "Sarah Boo"
  "JD Ramirez": "Judhell Dhy Ramirez"
  "Leia KC": "Leia Kook-Chun"
  # Spelling corrections: one person, credited once, spelled wrongly.
  "Dr. Martha Laldy": "Martha Ladly"
  "Aishwarya Bhattbhatt": "Aishwarya Bhatt"
  "Yang YI": "Yang Yi"
