# Taxonomy mapping — REVIEWED 2026-08-03
#
# Left side  = concept as it appears in WordPress (year/session already stripped)
# Right side = normalised slug, or `~` to drop the term entirely
# Comment    = (item count before merging)
#
# Edit this file and re-run `npm run extract` to apply. The extractor reads it
# when present and regenerates it only when absent, so edits survive re-runs.
#
# Decisions taken:
#   1. Merge the installation terms      — Interactive Installation -> installation
#   2. Merge the animation terms         — 3D Animation -> animation
#   3. Keep NIME separate                — it is a research field, not a medium
#   4. Drop single-use terms             — counted AFTER merging, see note below
#
# On (4): "used once" is evaluated on the post-merge total, not the raw count.
# Generative (3 after absorbing Generative Art and Generative design),
# Interactive Documentary (2 with Webdoc) and UX (2 with UX Design) each read as
# single-use in the raw list but are not, so they are kept.

# Display labels. Slugs are lowercase, so a label is derived from whichever
# source term matches the slug exactly — that recovers "AI", "VR", "NIME" and
# "3D Printing" without help. Override here only where the tidy form never
# existed as a WordPress term and so cannot be recovered.
labels:
  ug-thesis: UG Thesis            # only ever written "UGThesis"
  speculative-fiction: Speculative Fiction   # only ever written "SpeculativeFiction"

affiliation:
  Undergraduate: undergraduate   # (90)
  Graduate: graduate   # (83)
  Alumni: alumni   # (18)
  UGThesis: ug-thesis   # (17)
  Faculty: faculty   # (15)
  Undergrad: undergraduate   # (6)

medium:

  # --- AUTO-MERGE: spelling and spacing variants ----------------------------
  PhysicalComputing: physical-computing   # (11) -> Physical Computing
  "3Dprinting": 3d-printing   # (7) -> 3D Printing
  DigitalFabrication: digital-fabrication   # (6) -> Digital Fabrication
  Sculputure: sculpture   # (6) -> Sculpture
  Performace: performance   # (5) -> Performance
  SpeculativeFiction: speculative-fiction   # (2) -> Speculative Fiction
  DataVisualization: data-visualization   # (1) -> Data Visualization

  # --- MERGED (decisions 1-3) ----------------------------------------------
  "3D Animation": animation   # (22) decision 2 — merged
  Interactive Installation: installation   # (15) decision 1 — merged
  NIME: nime   # (3) decision 3 — KEPT SEPARATE, not merged into sound
  Machine Learning: ai   # (4) one of five terms for one concept
  Wearable Electronics: wearables   # (3)
  "ML_AI": ai   # (2)
  Artificial Intelligence: ai   # (1)
  Deep Neural Networks: ai   # (1)
  Audio: sound   # (1)
  Sonic Art: sound   # (1)
  Generative Art: generative   # (1)
  Generative design: generative   # (1)
  UX Design: ux   # (1)
  Webdoc: interactive-documentary   # (1)
  visualization and analysis: data-visualization   # (1)

  # --- DROPPED (decision 4): one item each, even after merging --------------
  Algorithm Design: ~   # (1)
  Art Movement: ~   # (1)
  Automation: ~   # (1)
  Business: ~   # (1)
  Data Transformation: ~   # (1)
  Design: ~   # (1)
  Digital Artwork: ~   # (1) too generic to be a useful facet
  Networked: ~   # (1)
  Playshop: ~   # (1)
  Speculative: ~   # (1) NOTE: could merge into speculative-fiction instead
  Typography: ~   # (1)
  Wellness: ~   # (1)

  # --- KEPT ----------------------------------------------------------------
  Code: code   # (112)
  Installation: installation   # (84)
  Physical Computing: physical-computing   # (66)
  Games: games   # (60)
  Video: video   # (49)
  Digital Fabrication: digital-fabrication   # (42)
  Web: web   # (42)
  Performance: performance   # (30)
